[workspace]
members = [
    "synapse-types",
    "synapse-log",
    "synapse-cli",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Satyam Das"]
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
bytes = "1.7"
bincode = "1.3"
rkyv = "0.8"
tempfile = "3.12"
criterion = "0.5"
