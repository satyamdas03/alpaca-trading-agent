[package]
name = "aureum-core"
version = "0.1.0"
edition = "2021"
authors = ["Satyam Das <satyamdas03@gmail.com>"]
description = "Formal execution engine for the Aureum financial semantic kernel"
license = "Apache-2.0"
repository = "https://github.com/point/aureum"
rust-version = "1.80"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
sha2 = "0.10"
petgraph = "0.6"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
