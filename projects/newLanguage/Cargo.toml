[workspace]
members = ["crates/aureum-core", "crates/aureum-py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Satyam Das <satyamdas03@gmail.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
